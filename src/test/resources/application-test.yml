spring:
  datasource:
    url: jdbc:h2:mem:orion-dispatch-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  jackson:
    property-naming-strategy: SNAKE_CASE
